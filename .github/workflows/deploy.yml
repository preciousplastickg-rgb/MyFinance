name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Готовый образ Playwright: WebKit и системные пакеты уже внутри — без `playwright install --with-deps`,
    # который 2026-11-06 по 15+ минут висел на apt. Версия образа = версии @playwright/test в package-lock.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Smoke и приёмка этапов в WebKit (iPhone 13) — до деплоя, а не только локально.
      - run: npm run test:e2e
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
