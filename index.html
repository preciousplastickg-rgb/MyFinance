<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Финансы" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Новая иконка — новая папка icons/vN: iOS и старый service worker держат иконку по адресу, по старому адресу
         «На экран „Домой“» ставил прежнюю (2026-11-09). Номер папки — ICON_DIR в scripts/gen-icons.mjs. -->
    <link rel="icon" href="./icons/v3/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/v3/apple-touch-icon.png" />
    <title>Финансы и дела</title>
    <script>
      // Тема и палитра до загрузки приложения: иначе тёмная тема мигает светлым при каждом старте.
      try {
        var t = localStorage.getItem('theme') || 'system';
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        // Значения --bg из tokens.css (светлая, тёмная): до загрузки CSS их взять неоткуда. Та же таблица — THEME_COLORS в domain/appearance.ts.
        var colors = { graphite: ['#f4f6f8', '#0c0d10'], navy: ['#f2f6fc', '#080e15'], espresso: ['#faf5f0', '#130c06'] };
        var p = localStorage.getItem('palette');
        if (!Object.prototype.hasOwnProperty.call(colors, p)) p = 'graphite';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.palette = p;
        if (localStorage.getItem('motion') === 'off') document.documentElement.dataset.motion = 'off';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[p][dark ? 1 : 0]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
